# Merge this snippet into the existing Nginx server block for kisaki0.top.
# Start the app with docker-compose.host-proxy.override.yml so only loopback ports are published.
# Do not place this file at the top level without a surrounding `server { ... }` block.

client_max_body_size 25m;

location ^~ /backend/api/ {
    rewrite ^/backend(/api/.*)$ $1 break;

    proxy_pass http://127.0.0.1:8081;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
    proxy_cache off;
}

location ^~ /backend/ {
    return 404;
}

location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
}
